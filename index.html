  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SGH1LLK5SH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SGH1LLK5SH');
  </script>

  <style>
    /* --- RESET & BASE --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      /* Subtle luxury gradient: Deep Black to Dark Red Glow at the bottom/center */
      background: radial-gradient(circle at 50% 30%, #1a0000 0%, #000000 70%);
      color: #ededed;
      font-family: 'Montserrat', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow-x: hidden;
    }

    /* --- LAYOUT CONTAINER --- */
    .container {
      width: 90%;
      max-width: 800px;
      padding: 20px;
      z-index: 2; /* Sit above any background effects */
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* --- LOGO --- */
    .logo {
      width: 250px; /* Adjust size as needed */
      height: auto;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 15px rgba(200, 0, 0, 0.3)); /* Red glow behind logo */
      transition: transform 0.3s ease;
    }

    .logo:hover {
      transform: scale(1.02);
    }

    /* --- TYPOGRAPHY --- */
    h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 42px;
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 5px;
      background: linear-gradient(to right, #fff, #b3b3b3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #cc0000; /* Signature Red */
      margin-bottom: 40px;
      font-weight: 600;
    }

    /* --- NAVIGATION BUTTONS --- */
    .nav-grid {
      display: flex;
      gap: 20px;
      margin-bottom: 50px;
      flex-wrap: wrap;
      justify-content: center;
    }

    a.btn {
      position: relative;
      display: inline-block;
      padding: 15px 40px;
      min-width: 180px;
      text-decoration: none;
      text-transform: uppercase;
      font-family: 'Oswald', sans-serif;
      font-size: 16px;
      letter-spacing: 2px;
      color: white;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      overflow: hidden;
    }

    /* The "Red Fill" Effect on Hover */
    a.btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 0%;
      height: 100%;
      background: #990000; /* The Branding Red */
      z-index: -1;
      transition: width 0.3s ease;
    }

    a.btn:hover::before {
      width: 100%;
    }

    a.btn:hover {
      border-color: #990000;
      box-shadow: 0 0 20px rgba(153, 0, 0, 0.6);
      transform: translateY(-2px);
    }

    /* Special style for the Events button to make it pop */
    a.btn.primary {
      border-color: #fff;
      background: rgba(255,255,255,0.05);
    }

    /* --- FOOTER / CONTACT --- */
    .footer {
      margin-top: 20px;
      padding-top: 30px;
      border-top: 1px solid rgba(255,255,255,0.1);
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .email-link {
      color: #666;
      font-size: 12px;
      text-decoration: none;
      letter-spacing: 1px;
      transition: 0.3s;
      margin-bottom: 20px;
      font-family: monospace;
    }

    .email-link:hover {
      color: #cc0000;
    }

    /* --- QR CODE --- */
    .qr-container {
      background: white;
      padding: 8px;
      border-radius: 2px;
      opacity: 0.9;
      transition: 0.3s;
    }

    .qr-container:hover {
      opacity: 1;
      box-shadow: 0 0 15px white;
    }

    .qr-container img {
      display: block;
      width: 120px;
      height: 120px;
    }
    
    .scan-text {
      font-size: 10px;
      color: #444;
      margin-top: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 600px) {
      .nav-grid {
        flex-direction: column;
        width: 100%;
      }
      
      a.btn {
        width: 100%;
      }

      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    
    <!-- Logo -->

    <!-- Typography -->

    <!-- Navigation -->
    <div class="nav-grid">
      <a

      >
        Events
      </a>
      
      <a 
        href="blogs.html"

      >
        Blogs
      </a>

      <a 
        href="https://chat.whatsapp.com/LeQP0EFPY1BCM4wEySQlfj" 
        target="_blank" 
        class="btn"
        onclick="gtag('event','click',{event_category:'button',event_label:'whatsapp'});"
      >
        Join Community
      </a>
    </div>

    <!-- Footer Area -->
    <div class="footer">
      <a href="mailto:ta7telard.eg@outlook.com" class="email-link">
        ta7telard.eg@outlook.com
      </a>

      <div class="qr-container">
        <img
          src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://chat.whatsapp.com/LeQP0EFPY1BCM4wEySQlfj"
          alt="WhatsApp QR"
        />
      </div>
      <span class="scan-text">Scan to Join</span>
    </div>

  </div>

</body>
</html>
