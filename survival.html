<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SURVIVAL GEAR | TA7TELARD</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SGH1LLK5SH"></script>
  <script>
    window.dataLayer = window.dataLayer ||[];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SGH1LLK5SH');
  </script>

  <style>
    /* --- RESET & BASE --- */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #050505;
      color: white;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 50px;
      overflow-x: hidden;
    }

    /* --- HEADER --- */
    .header {
      width: 100%;
      padding: 40px 20px;
      text-align: center;
      position: relative;
    }

    h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 36px;
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 10px;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }

    p.subtitle {
      color: #cc0000;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 13px;
      font-weight: 600;
    }

    a.back-home {
      display: inline-block;
      margin-top: 15px;
      font-size: 12px;
      color: #888;
      text-decoration: none;
      border: 1px solid #333;
      padding: 8px 20px;
      transition: 0.3s;
      font-family: 'Oswald', sans-serif;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    a.back-home:hover {
      border-color: #fff;
      color: #fff;
      background: #111;
    }

    /* --- CONTAINER --- */
    .container {
      width: 100%;
      max-width: 1200px;
      padding: 0 20px;
      text-align: center;
      margin-top: 20px;
    }

    /* --- PRODUCT GRID --- */
    .product-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      animation: fadeIn 0.6s ease;
    }

    .product-card {
      width: 320px;
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      padding: 15px;
      text-align: center;
      transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border-color: #333;
    }

    /* Hover Glow Effect */
    .product-card:hover::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      box-shadow: 0 0 20px rgba(204, 0, 0, 0.15); /* Red Glow */
      pointer-events: none;
      z-index: -1;
    }

    .img-placeholder {
      width: 100%;
      height: 300px;
      background: #fff; /* White background for clean product view */
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 4px;
    }
    
    .img-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0.8;
      transition: 0.4s;
      filter: grayscale(100%);
    }

    .product-card:hover .img-placeholder img {
      opacity: 1;
      transform: scale(1.05);
      filter: grayscale(0%);
    }

    .product-title {
      font-family: 'Oswald', sans-serif;
      font-size: 16px;
      letter-spacing: 1px;
      margin-bottom: 5px;
      color: #fff;
      line-height: 1.3;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .product-price {
      color: #888;
      font-size: 14px;
      margin-bottom: 20px;
      font-family: monospace;
    }

    .buy-btn {
      display: inline-block;
      width: 100%;
      padding: 12px 0;
      background: transparent;
      border: 1px solid #fff;
      color: #fff;
      font-family: 'Oswald', sans-serif;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      text-decoration: none;
      transition: 0.3s;
    }

    .buy-btn:hover {
      background: #cc0000;
      border-color: #cc0000;
      color: white;
    }

    /* Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      h1 { font-size: 28px; }
      .product-card { width: 100%; }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>SURVIVAL GEAR</h1>
    <p class="subtitle">Secure Your Essentials</p>
    <a href="index.html" class="back-home">← BACK TO MAIN</a>
  </div>

  <div class="container">
    <div class="product-list" id="productList">
      <!-- Products will be generated here by JavaScript -->
    </div>
  </div>

  <script>
    // --- DATABASE ---
    const survivalDB = [
      {
        id: 1,
        title: "Anti-Theft Cell Phone Keeper",
        price: "EGP 144.99", 
        img: "https://m.media-amazon.com/images/I/51Zw3cPzEtL._AC_SX679_.jpg",
        link: "https://amzn.to/4clp5Bp"
      },
      {
        id: 2,
        title: "Hidden Security Belt",
        price: "EGP 199.99",
        img: "https://m.media-amazon.com/images/I/51Go8ojq-UL._AC_SL1500_.jpg",
        link: "https://amzn.to/3MZTESI"
      },
      {
        id: 3,
        title: "Fan Saver",
        price: "EGP 142.00",
        img: "https://m.media-amazon.com/images/I/61w3zyoyLbL._AC_SL1500_.jpg",
        link: "https://amzn.to/4smrY9B"
      },
      {
        id: 4,
        title: "Glasses Holder Strap",
        price: "EGP 75.00",
        img: "https://m.media-amazon.com/images/I/41DrO0c1wGL._AC_SX425_.jpg",
        link: "https://amzn.to/3OTPT1N"
      }
    ];

    // --- LOGIC ---
    const productList = document.getElementById('productList');

    function renderProducts() {
      survivalDB.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        
        let btnHTML = `<a href="${p.link}" target="_blank" class="buy-btn">ORDER NOW</a>`;
        if (p.link === "#" || p.link === "") {
          btnHTML = `<a href="#" class="buy-btn" style="border-color:#333; color:#777; pointer-events:none;">COMING SOON</a>`;
        }

        card.innerHTML = `
          <div class="img-placeholder">
            <img src="${p.img}" alt="${p.title}">
          </div>
          <h3 class="product-title">${p.title}</h3>
          <p class="product-price">${p.price}</p>
          ${btnHTML}
        `;
        productList.appendChild(card);
      });
    }

    // Initialize the page rendering
    renderProducts();

  </script>

</body>
</html>
