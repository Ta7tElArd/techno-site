<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLOGS | TA7TELARD</title>

  <!-- Google Fonts: Oswald & Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SGH1LLK5SH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SGH1LLK5SH');
  </script>

  <style>
    /* --- RESET & BASE --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      /* Luxury Gradient matching Home page */
      background: radial-gradient(circle at 50% 50%, #1a0000 0%, #000000 100%);
      color: #ededed;
      font-family: 'Montserrat', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    /* --- CONTENT WRAPPER --- */
    .container {
      max-width: 600px;
      padding: 20px;
      z-index: 2;
    }

    /* --- TYPOGRAPHY --- */
    h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 50px;
      letter-spacing: 12px;
      text-transform: uppercase;
      margin-bottom: 10px;
      color: white;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    .tagline {
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #cc0000; /* Signature Red */
      margin-bottom: 60px;
      font-weight: 600;
      opacity: 0.9;
    }

    /* --- COMING SOON SECTION --- */
    .status-box {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 40px 0;
      margin-bottom: 60px;
    }

    .status-text {
      font-family: 'Oswald', sans-serif;
      font-size: 24px;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 10px;
    }

    .sub-status {
      font-size: 12px;
      letter-spacing: 2px;
      color: #666;
      text-transform: uppercase;
    }

    /* --- BUTTONS --- */
    a.btn-back {
      display: inline-block;
      padding: 12px 30px;
      border: 1px solid #cc0000;
      color: #cc0000;
      text-decoration: none;
      font-family: 'Oswald', sans-serif;
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: all 0.4s ease;
      background: transparent;
    }

    a.btn-back:hover {
      background: #cc0000;
      color: white;
      box-shadow: 0 0 25px rgba(204, 0, 0, 0.5);
      transform: translateY(-3px);
    }

    /* --- DECORATIVE ELEMENTS --- */
    .scanline {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* Subtle pulse animation for the red text */
    @keyframes pulse {
      0% { opacity: 0.8; }
      50% { opacity: 1; text-shadow: 0 0 15px rgba(204, 0, 0, 0.8); }
      100% { opacity: 0.8; }
    }

    .pulse {
      animation: pulse 3s infinite ease-in-out;
    }

    @media (max-width: 600px) {
      h1 { font-size: 36px; letter-spacing: 8px; }
      .tagline { font-size: 11px; }
    }
  </style>
</head>

<body>

  <!-- Subtle CRT Scanline effect for "Underground" vibe -->
  <div class="scanline"></div>

  <div class="container">
    
    <h1>BLOGS</h1>
    <p class="tagline">The Underground Archives</p>

    <div class="status-box">
      <div class="status-text pulse">SOON ENOUGH</div>
      <div class="sub-status">Journal Access Restricted</div>
    </div>

    <a href="index.html" class="btn-back">
      ← Return to Main
    </a>

  </div>

</body>
</html>
