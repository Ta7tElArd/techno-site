<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SHOP | TA7TELARD</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SGH1LLK5SH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SGH1LLK5SH');
  </script>

  <style>
    /* --- RESET & BASE --- */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #050505;
      color: white;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 50px;
    }

    /* --- HEADER --- */
    .header {
      width: 100%;
      padding: 30px 20px;
      text-align: center;
      position: relative;
    }

    h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 32px;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 10px;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }

    p.subtitle {
      color: #cc0000;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 12px;
      font-weight: 600;
    }

    a.back-home {
      display: inline-block;
      margin-top: 15px;
      font-size: 12px;
      color: #888;
      text-decoration: none;
      border: 1px solid #333;
      padding: 8px 16px;
      transition: 0.3s;
    }

    a.back-home:hover {
      border-color: #fff;
      color: #fff;
    }

    /* --- NAVIGATION / BREADCRUMBS --- */
    .nav-controls {
      display: flex;
      justify-content: center;
      margin-bottom: 30px;
      min-height: 40px;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid #cc0000;
      color: #cc0000;
      padding: 10px 20px;
      font-family: 'Oswald', sans-serif;
      text-transform: uppercase;
      cursor: pointer;
      display: none; /* Hidden by default */
      font-size: 14px;
      letter-spacing: 1px;
    }

    .nav-btn:hover {
      background: #cc0000;
      color: white;
    }

    /* --- SELECTION CONTAINERS --- */
    .container {
      width: 100%;
      max-width: 1200px;
      padding: 0 20px;
      text-align: center;
    }

    h2.step-title {
      font-size: 14px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 30px;
    }

    /* --- CATEGORY GRID --- */
    .category-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .category-card {
      width: 200px;
      height: 120px;
      background: #111;
      border: 1px solid #333;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: 0.3s;
      position: relative;
      overflow: hidden;
    }

    .category-card:hover {
      border-color: #cc0000;
      background: #1a0000;
      transform: translateY(-5px);
    }

    .category-name {
      font-family: 'Oswald', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      z-index: 2;
    }

    .item-count {
      font-size: 11px;
      color: #666;
      margin-top: 5px;
      z-index: 2;
    }

    /* --- PRODUCT GRID --- */
    .product-list {
      display: none; /* Hidden initially */
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      animation: fadeIn 0.5s ease;
    }

    .product-card {
      width: 300px;
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      padding: 15px;
      text-align: center;
      transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border-color: #333;
    }

    .img-placeholder {
      width: 100%;
      height: 300px;
      background: #111;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .img-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.8;
      transition: 0.4s;
      filter: grayscale(100%);
    }

    .product-card:hover .img-placeholder img {
      opacity: 1;
      transform: scale(1.05);
      filter: grayscale(0%);
    }

    .product-title {
      font-family: 'Oswald', sans-serif;
      font-size: 18px;
      letter-spacing: 1px;
      margin-bottom: 5px;
      color: #fff;
    }

    .product-price {
      color: #888;
      font-size: 14px;
      margin-bottom: 20px;
      font-family: monospace;
    }

    .buy-btn {
      display: inline-block;
      width: 100%;
      padding: 12px 0;
      background: transparent;
      border: 1px solid #fff;
      color: #fff;
      font-family: 'Oswald', sans-serif;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      text-decoration: none;
      transition: 0.3s;
    }

    .buy-btn:hover {
      background: white;
      color: black;
    }

    /* Empty state */
    .empty-msg {
      color: #666;
      font-family: 'Oswald', sans-serif;
      letter-spacing: 2px;
      margin-top: 50px;
    }

    /* Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

  </style>
</head>

<body>

  <div class="header">
    <h1>MERCH ARCHIVE</h1>
    <p class="subtitle">Limited Edition / Underground Wear</p>
    <a href="index.html" class="back-home">← BACK TO HOME</a>
  </div>

  <div class="container">

    <!-- Navigation Controls -->
    <div class="nav-controls">
      <button id="backToCats" class="nav-btn">← Choose Category</button>
    </div>

    <!-- STEP 1: CATEGORY SELECTION -->
    <div id="categoryView">
      <h2 class="step-title">Select Category</h2>
      <div class="category-grid" id="categoryGrid">
        <!-- Generated by JS -->
      </div>
    </div>

    <!-- STEP 2: PRODUCT LIST -->
    <div id="productView" style="display:none;">
      <h2 class="step-title" id="selectedCatTitle">Category</h2>
      <div class="product-list" id="productList">
        <!-- Generated by JS -->
      </div>
    </div>

  </div>

  <script>
    // --- DATABASE ---
    const productsDB = [
      {
        id: 1,
        category: "Eyewear",
        title: "Butterfly Oversized",
        price: "EGP 355.00",
        img: "https://i.ibb.co/b5sqcRkT/Change-the-cry-2k-202602201711.jpg",
        link: "https://amzn.to/46gG9EM"
      },
      {
        id: 2,
        category: "Eyewear",
        title: "Rotating Eyeballs",
        price: "EGP 259.00",
        img: "https://i.ibb.co/6R35H9KQ/Replace-rainbow-glasses-2k-202602220019.jpg",
        link: "https://amzn.to/4b3wt36"
      },
      {
        id: 3,
        category: "Eyewear",
        title: "Heart Shaped Love Effects",
        price: "EGP 399.00",
        img: "https://i.ibb.co/8LkQNK4X/Woman-with-pink-hair-glasses-cd09e58f68.jpg",
        link: "https://amzn.to/4ceGlYV"
      },
      {
        id: 4,
        category: "Apparel",
        title: "Psychedelic Printed Shirt",
        price: "EGP 493.00",
        img: "https://i.ibb.co/675nV9zW/Image-in-ta7telard-style-21d23a37d3.jpg",
        link: "https://amzn.to/4r2kPdH"
      },
      {
        id: 5,
        category: "Accessories",
        title: "Chinese Techno Fan",
        price: "EGP 95.00",
        img: "https://i.ibb.co/V0Wr7bjz/Image-in-ta7telard-style-e104f82de5.jpg",
        link: "https://amzn.to/4leAghP"
      },
      {
        id: 6,
        category: "Accessories",
        title: "Jungle Techno Fan",
        price: "EGP 99.99",
        img: "https://i.ibb.co/4wH6F0Xr/Replace-fan-with-green-49199540ba.jpg",
        link: "https://amzn.to/4aZ2bNK"
      },
      {
        id: 7,
        category: "Accessories",
        title: "Fire Swirl Techno Fan",
        price: "EGP 99.99",
        img: "https://i.ibb.co/x86LcW9f/Replace-black-fan-swirl-fan-691a20ee6f.jpg",
        link: "https://amzn.to/3N9I07W"
      }
    ];

    // Define categories
    const categories = [
      { name: "Eyewear", id: "Eyewear" },
      { name: "Apparel", id: "Apparel" },
      { name: "Accessories", id: "Accessories" }
    ];

    // --- LOGIC ---
    
    const categoryView = document.getElementById('categoryView');
    const categoryGrid = document.getElementById('categoryGrid');
    const productView = document.getElementById('productView');
    const productList = document.getElementById('productList');
    const backBtn = document.getElementById('backToCats');
    const selectedCatTitle = document.getElementById('selectedCatTitle');

    // 1. Render Categories
    function renderCategories() {
      categoryGrid.innerHTML = '';
      
      categories.forEach(cat => {
        // Count items in this category
        const count = productsDB.filter(p => p.category === cat.id).length;
        
        const div = document.createElement('div');
        div.className = 'category-card';
        div.innerHTML = `
          <span class="category-name">${cat.name}</span>
          <span class="item-count">${count} Items</span>
        `;
        div.onclick = () => showProducts(cat.id);
        categoryGrid.appendChild(div);
      });
    }

    // 2. Render Products
    function showProducts(catId) {
      // Switch Views
      categoryView.style.display = 'none';
      productView.style.display = 'block';
      backBtn.style.display = 'block';
      
      selectedCatTitle.innerText = catId.toUpperCase();
      productList.style.display = 'flex'; // Ensure flex layout
      productList.innerHTML = '';

      // Filter products
      const filtered = productsDB.filter(p => p.category === catId);

      if (filtered.length === 0) {
        productList.innerHTML = '<div class="empty-msg">NO DROPS CURRENTLY AVAILABLE</div>';
        return;
      }

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        
        let btnHTML = `<a href="${p.link}" target="_blank" class="buy-btn">ORDER NOW</a>`;
        // Handle "Coming Soon" or empty links
        if (p.link === "#" || p.link === "") {
          btnHTML = `<a href="#" class="buy-btn" style="border-color:#333; color:#555; pointer-events:none;">COMING SOON</a>`;
        }

        card.innerHTML = `
          <div class="img-placeholder">
            <img src="${p.img}" alt="${p.title}">
          </div>
          <h3 class="product-title">${p.title}</h3>
          <p class="product-price">${p.price}</p>
          ${btnHTML}
        `;
        productList.appendChild(card);
      });
    }

    // 3. Back Navigation
    backBtn.onclick = () => {
      productView.style.display = 'none';
      categoryView.style.display = 'block';
      backBtn.style.display = 'none';
    };

    // Initialize
    renderCategories();

  </script>

</body>
</html>
