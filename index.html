  <style>
    body {
      margin: 0;
      padding: 60px 20px;
      font-family: monospace;
      color: white;
      text-align: center;
      letter-spacing: 1px;
      background: url("bg.gif") no-repeat center center fixed;
      background-size: cover;
      perspective: 1200px; /* perspective for 3D */
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: -1;
      transform: translateZ(-50px) scale(1.05); /* slight 3D depth */

    /* logo in top-left */
    .logo {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 300px;
      height: auto;
      z-index: 10;
      transform: rotateY(-10deg) translateZ(20px);
      transition: transform 0.5s;
    }

    .logo:hover {
      transform: rotateY(0deg) translateZ(40px) scale(1.05);
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
      transform: translateZ(50px);
    }

    p {
      opacity: 0.8;
      margin-bottom: 30px;
      transform: translateZ(30px);
    }

    .join {
      display: inline-block;
      margin: 20px 10px;
      padding: 15px 35px;
      border: 1px solid white;
      color: white;
      text-decoration: none;
      letter-spacing: 3px;
      transition: 0.3s;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(2px);
      transform: rotateX(0deg) rotateY(0deg) translateZ(20px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    .join:hover {
      background: white;
      color: black;
      transform: rotateX(5deg) rotateY(5deg) translateZ(50px) scale(1.1);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .qr {
      margin-top: 40px;
      transform: translateZ(40px) rotateY(-5deg);
      transition: transform 0.5s;
      display: inline-block;
    }

    .qr img {
      background: white;
      padding: 10px;
      border-radius: 6px;
      transform: rotateX(2deg) translateZ(20px);
    }

    .qr:hover {
      transform: translateZ(60px) rotateY(0deg) scale(1.05);
    }

    /* ad container fixes */
    .ad-container {
      width: 100%;
      max-width: 800px;
      margin: 40px auto;
      position: relative;
      z-index: 5;
      background: transparent;
      transform: translateZ(25px);
    }

    .ad-container iframe {
