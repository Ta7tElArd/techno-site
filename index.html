<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TA7TELARD</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SGH1LLK5SH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SGH1LLK5SH');
  </script>

  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      background: black;
      color: white;
      font-family: monospace;
      text-align: center;
      letter-spacing: 1px;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    p {
      opacity: 0.7;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      padding: 12px 30px;
      border: 1px solid white;
      color: white;
      text-decoration: none;
      letter-spacing: 2px;
      transition: 0.2s;
      margin-top: 20px;
    }

    .button:hover {
      background: white;
      color: black;
    }

    .side-section {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 60px;
      margin-top: 40px;
      flex-wrap: wrap;
    }

    .qr img {
      width: 220px;
      border: 1px solid #444;
    }

    .events-preview {
      width: 260px;
      background: rgba(0,0,0,0.6);
      border: 1px solid #444;
      padding: 15px;
      border-radius: 8px;
      overflow: hidden;
    }

    .events-preview h3 {
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 16px;
      letter-spacing: 2px;
    }

    .slider {
      position: relative;
      width: 100%;
      height: 360px;
      overflow: hidden;
    }

    .slider img {
      position: absolute;
      width: 100%;
      height: auto;
      left: 0;
      top: 0;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
      border-radius: 6px;
      border: 1px solid #555;
      cursor: pointer;
    }

    .slider img.active {
      opacity: 1;
    }

  </style>
</head>

<body>

  <h1>TA7TELARD</h1>
  <p>Underground Techno Movement</p>

  <a href="events.html" class="button">VIEW ALL EVENTS</a>

  <div class="side-section">

    <div class="qr">
      <img
        src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https://chat.whatsapp.com/LeQP0EFPY1BCM4wEySQlfj"
        alt="WhatsApp Group QR Code"
      />
    </div>

    <div class="events-preview">
      <h3>AVAILABLE EVENTS</h3>
      <div class="slider" id="slider"></div>
    </div>

  </div>

  <script>
    fetch('events.html')
      .then(response => response.text())
      .then(data => {
        const parser = new DOMParser();
        const doc = parser.parseFromString(data, 'text/html');
        const events = doc.querySelectorAll('.event');
        const slider = document.getElementById('slider');

        if (events.length > 0) {
          events.forEach((event, index) => {
            const imgSrc = event.querySelector('img').src;
            const reserveLink = event.querySelector('a[href^="http"]').href;

            const img = document.createElement('img');
            img.src = imgSrc;

            if(index === 0) img.classList.add('active');

            img.onclick = function() {
              window.open(reserveLink, '_blank');
            };

            slider.appendChild(img);
          });

          let current = 0;
          const slides = slider.querySelectorAll('img');

          setInterval(() => {
            slides[current].classList.remove('active');
            current = (current + 1) % slides.length;
            slides[current].classList.add('active');
          }, 3000);
        }
      });
  </script>

</body>
</html>
