<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TA7TELARD</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SGH1LLK5SH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SGH1LLK5SH');
  </script>

  <style>
    body {
      margin: 0;
      padding: 60px 20px;
      font-family: monospace;
      color: white;
      text-align: center;
      letter-spacing: 1px;
      background: url("bg.gif") no-repeat center center fixed;
      background-size: cover;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: -1;
    }

    .logo {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 300px;
      height: auto;
      z-index: 10;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    p {
      opacity: 0.8;
      margin-bottom: 30px;
    }

    .join {
      display: inline-block;
      margin: 20px 10px;
      padding: 15px 35px;
      border: 1px solid white;
      color: white;
      text-decoration: none;
      letter-spacing: 3px;
      transition: 0.2s;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(2px);
    }

    .join:hover {
      background: white;
      color: black;
    }

    .slider-container {
      max-width: 400px;
      margin: 60px auto 20px auto;
    }

    .slider-container h2 {
      font-size: 18px;
      margin-bottom: 15px;
      letter-spacing: 2px;
    }

    .slider {
      position: relative;
      height: 500px;
      overflow: hidden;
    }

    .slider img {
      position: absolute;
      width: 100%;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
      border: 1px solid #555;
      border-radius: 8px;
      cursor: pointer;
    }

    .slider img.active {
      opacity: 1;
    }

    .qr {
      margin-top: 40px;
    }

    .qr img {
      background: white;
      padding: 10px;
      border-radius: 6px;
    }

    .ad-container {
      width: 100%;
      margin: 40px auto;
      position: relative;
      z-index: 1;
    }
  </style>
</head>

<body>

  <div class="overlay"></div>

  <img src="logo.png" alt="TA7TELARD Logo" class="logo" />

  <h1>TA7TELARD</h1>
  <p>Your insider access to the Underground scene 🔊</p>

  <a
    class="join"
    href="https://chat.whatsapp.com/LeQP0EFPY1BCM4wEySQlfj"
    target="_blank"
    onclick="gtag('event','click',{event_category:'button',event_label:'whatsapp'});"
  >
    JOIN WHATSAPP GROUP
  </a>

  <a
    class="join"
    href="events.html"
    onclick="gtag('event','click',{event_category:'button',event_label:'events'});"
  >
    EVENTS
  </a>

  <a class="join" href="blogs.html">BLOGS</a>

  <!-- 🔥 Events Auto Slider -->
  <div class="slider-container">
    <h2>UPCOMING EVENTS</h2>
    <div class="slider" id="slider"></div>
  </div>

  <!-- 💰 Ad Banner -->
  <div class="ad-container">
    <iframe data-aa='2426881'
      src='//acceptable.a-ads.com/2426881/?size=Adaptive'
      style='border:0; width:70%; height:120px; display:block; margin:auto;'>
    </iframe>
  </div>

  <div class="qr">
    <img
      src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https://chat.whatsapp.com/LeQP0EFPY1BCM4wEySQlfj"
      alt="WhatsApp Group QR Code"
    />
  </div>

  <script>
    const events = [
      {
        img: "https://cairoevent.com/cdn/shop/files/IMG_2448_720x.jpg?v=1770052502",
        link: "https://cairoevent.com/collections/rawi-lounge/products/saturday-7-feb"
      },
      {
        img: "https://cairoevent.com/cdn/shop/files/107bcffb-ffdf-48df-bb2a-e859b3ff40a2_720x.jpg?v=1770317181",
        link: "https://cairoevent.com/collections/frontpage/products/monday-9-feb"
      }
    ];

    const slider = document.getElementById("slider");

    events.forEach((event, index) => {
      const img = document.createElement("img");
      img.src = event.img;
      if (index === 0) img.classList.add("active");
      img.onclick = () => window.open(event.link, "_blank");
      slider.appendChild(img);
    });

    let current = 0;
    const slides = slider.querySelectorAll("img");

    setInterval(() => {
      slides[current].classList.remove("active");
      current = (current + 1) % slides.length;
      slides[current].classList.add("active");
    }, 3000);
  </script>

</body>
</html>
